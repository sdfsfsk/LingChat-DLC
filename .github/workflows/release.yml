name: Build DLC release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (bump package manifest versions first)
        required: true
        default: v1.1.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/package.py
        env:
          DLC_REPOSITORY: ${{ github.repository }}
          DLC_RELEASE_TAG: ${{ inputs.tag }}
      - name: Publish immutable archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip --target "$GITHUB_SHA" --title "LingChat DLC $RELEASE_TAG" --generate-notes
      - name: Publish catalog after assets are available
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json catalog-v2.json
          git diff --cached --quiet || git commit -m "Update downloadable DLC catalog"
          git push origin HEAD:main
