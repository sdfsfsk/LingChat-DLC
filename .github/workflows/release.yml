name: Build DLC release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused release tag (versions come from each package manifest)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/test_package_release.py
      - run: python scripts/package.py
      - name: Publish immutable ZIPs and their manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DLC_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/publish.py "$RELEASE_TAG"
