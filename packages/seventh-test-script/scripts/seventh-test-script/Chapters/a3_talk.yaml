# v2.13：剧情演出及可重置的终局错误，不损坏实际剧本文件。
name: 3-2 只有我们两个
events:
- type: dialogue
  character: MAIN
  emotion: 正常
  text: |
    【正常】%player%，我把所有事都告诉你吧。
    【正常】第一周的"终场演出"，是我自己改的。
    【正常】黑板上的字、我被撕掉的最后一页、钦灵台本里多出来的那些行——
    【正常】都是我。
