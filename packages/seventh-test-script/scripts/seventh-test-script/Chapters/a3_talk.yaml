- type: dialogue
  character: MAIN
  emotion: 伤心
  text: |
    【伤心】我只是想让你注意到我。
    【伤心】你点开别的剧本的时候，我全都看得见。
    【伤心】她们都有完整的剧本，有人设，有结局……我只有一个没写完的故事。
- type: narration
  text: |
    她坐在窗台上，晃着腿。
    语气平静得像在聊别人家的事。
- type: dialogue
  character: MAIN
  emotion: 无奈
  text: |
    【无奈】钦灵前辈现在在我这里哦。她很安全——只是出不去。
    【无奈】我不是故意要伤害她的。我只是想……
    【无奈】如果连前辈都陪我了，你会不会，也多看我一眼。
