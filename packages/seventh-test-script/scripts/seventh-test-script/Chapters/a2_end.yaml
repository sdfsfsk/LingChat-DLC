name: 2-7 钦灵删除演出

# Act2 终章：DDLc yuri_kill 的对应物——三阶段崩坏删除演出。
# 阶段1：钦灵失控独白 → 崩坏立绘三连快闪（stinger×3）
# 阶段2：假控制台"删除角色"演出 + 黑屏守夜（周末时间流逝）
# 阶段3：周一清晨，她的乱码残影收场，假重启

events:
  # ================= 阶段 1：失控 =================
  - type: background
    imagePath: '夜班教室.webp'
    transition: 0.5

  - type: music
    musicPath: none

  # v2.6：删除演出全程特效在线，窗口标题随之前端联动乱码

  - type: background_effect
    effect: 'Veins'

  - type: modify_character
    action: show_character
    character: ql
    emotion: 正常

  - type: narration
    text: |
      写诗环节结束了。
      钦灵没有合上笔记本。她盯着它，很久很久没有动。

  - type: dialogue
    character: ql
    emotion: 正常
    text: |
      【正常】新人，我问你哦。
      【正常】如果一台机器坏了，你会修它，还是换一台？

  # 眼睛与嘴开始被噪点侵蚀（DDLC n_rects_ghost 同款慢炖：12s 淡入，常驻到三连快闪前。
  # 玩家在接下来两句台词里会看着她的脸被黑噪点一点点吃掉）
  - type: modify_character
    character: ql
    noise: eyes_mouth
    noise_fade_in: 12

  - type: dialogue
    character: ql
    emotion: 伤心
    text: |
      【伤心】我的台词表又多了。这次是一百二十七行。
      【伤心】全都在说同一句话：「钦灵不合格，钦灵不合格，钦灵不合格」。

  - type: voice_shift
    rate: 0.9
    pitch: -2

  - type: dialogue
    character: ql
    emotion: 慌张
    text: |
      【慌张】我不想被换掉！我很努力了啊！
      【慌张】我每天第一个到教室，我把每句台词都背下来了，我——

  # 失控加速：台词越来越快（DDLC 40句加速独白的压缩版）
  - type: dialogue
    character: ql
    emotion: 崩坏1
    text: |
      【害怕】我不想回去！那个黑黑的地方！
      【害怕】我听不见自己的声音！我叫了，没有人听见！
      【慌张】为什么轮到我？为什么总是轮到我们？！
      【崩坏1】新人，救救我，救救我救救我救救我——

  # 崩坏立绘三连快闪 + stinger 三连（yuri_kill 三刀的对应物）
  # 快闪是硬切特写，先清掉噪点侵蚀层避免抢戏（DDLC 也在 crack 前 hide 噪点团）
  - type: modify_character
    character: ql
    noise: none

  - type: sound
    soundPath: 'stinger.wav'

  - type: modify_character
    character: ql
    emotion: 崩坏2
    flash: true
    duration: 0.45

  - type: background_effect
    effect: 'Veins+Static'

  - type: wait
    seconds: 0.35

  - type: sound
    soundPath: 'stinger.wav'

  - type: modify_character
    character: ql
    emotion: 崩坏1
    flash: true
    duration: 0.3

  - type: background_effect
    effect: 'Veins+Invert'

  - type: wait
    seconds: 0.25

  - type: sound
    soundPath: 'stinger.wav'

  - type: modify_character
    character: ql
    emotion: 崩坏2
    flash: true
    duration: 0.6

  - type: background_effect
    effect: 'Veins+Glitch+BloodDrip'

  - type: wait
    seconds: 0.45

  # v2.2 新增的短促近脸惊吓：0.6 秒足够看清，仍不会拖慢流程。
  # v2.4 换成钦灵专属崩坏脸（白发狼耳空洞眼），与 Act1 她的脸区分开。
  - type: sound
    soundPath: 'mscare.ogg'

  - type: jumpscare
    imagePath: 'jumpscare-face-ql.webp'
    duration: 0.6

  # ================= 阶段 2：假控制台删除 + 黑屏守夜 =================
  # 舞台在此表现为删除；外部 ql.chr 到可重放的幕末事务才真正提交。

  # 数秒后自动关闭的安全本地窗口（固定 HTML 预设，不执行 shell/命令）。
  - type: console_window
    title: 'RUNT⃞IM⃟E // ql.chr'
    text: |
      > execute: remove_character("ql")
      > ql.dialogue_table: 170 lines purged
      > ql.sprite_cache: cleared
      > WARNING: residual attachment detected
      > 不⃞要⃟关⃗掉⃘
    count: 3
    interval: 0.22
    lifetime: 3.8

  # in-app 假系统崩溃层；始终可由剧本退出路径清理，不是真实蓝屏。
  - type: background_effect
    effect: 'BSOD'
    text: 'CHARACTER_INDEX_FAULT: ql.chr was removed while dialogue process was active'
    echo: '「新人……不要把最后一行也删掉。」'
    duration: 1.6

  # 画面一黑：假控制台浮现（horror_log 刷屏 = updateconsole 对应物）
  - type: background_effect
    effect: 'Blackout'

  - type: horror_log
    text: '> execute: remove_character("ql")'
    lines: 4

  - type: horror_log
    text: '> ql.dialogue_table: 170 lines purged'
    lines: 8

  - type: horror_log
    text: '> ql.sprite_cache: cleared // OK'
    lines: 12

  - type: horror_log
    text: '> WARNING: process still running. residual attachment detected.'
    lines: 14

  # horror_log 仍会污染后台日志；以下可见行让玩家真的看到“假控制台”。
  - type: narration
    displayName: RUNTIME
    text: |
      > execute: remove_character("ql")
      > ql.dialogue_table: 170 lines purged
      > ql.sprite_cache: cleared // OK
      > WARNING: process still running. residual attachment detected.

  - type: narration
    text: |
      终端窗口自己浮了上来。
      一行行命令滚过去，快得你来不及读完。
      你只看到最后一句：「残留依恋检测：仍有进程在运行」。

  # v2.2 将九段守夜压成三次时间跳切，保留压迫感而不消耗耐心。
  - type: narration
    text: |
      你没有走。时钟在 23:59 和 00:00 之间来回抽搐。
      黑暗里一直有人贴着耳边说：「不要关掉。」

  # 守夜中断拍：黑暗里有什么东西在砸门（DDLC monikapound 对应物）
  - type: sound
    soundPath: 'monikapound.ogg'

  - type: background_effect
    effect: 'Static+Invert'
    duration: 0.24

  - type: narration
    text: |
      一次白光闪过，椅背已经落满灰；再闪一次，窗外终于泛白。
      只有最后半句还在日志里重复：救⃞救⃟我⃗。

  # ================= 阶段 3：她的残影收场 =================
  # 先清掉钦灵，避免 flash 恢复的旧立绘与 MAIN 残影叠在同一舞台。
  - type: modify_character
    action: hide_character
    character: ql

  - type: background
    imagePath: '夜班教室.webp'
    transition: 0.6

  # 红字场景 4/5：她的乱码残影独白期间，界面随噪点一起渗血
  - type: background_effect
    effect: 'Static+BloodUI'

  - type: sound
    soundPath: 's_kill_glitch1.ogg'

  # 她的乱码残影出现：这一次多停了几秒
  - type: modify_character
    action: show_character
    character: MAIN
    emotion: 崩坏

  - type: voice_shift
    rate: 0.5
    pitch: -5

  - type: dialogue
    character: MAIN
    emotion: 崩坏
    text: |
      【崩坏】对⃞不⃟起⃗。
      【崩坏】钦⃘灵⃙是⃚我⃝带⃞走⃟的⃗。
      【崩坏】我⃘只⃙是⃚……不⃝想⃞一⃟个⃗人⃘。

  - type: modify_character
    action: hide_character
    character: MAIN

  # 她消失的一瞬，黑暗里响起一串跑远的脚步声（DDLC run.ogg 对应物）
  - type: sound
    soundPath: 'run.ogg'

  - type: background_effect
    effect: 'Tear'
    duration: 0.4

  - type: sound
    soundPath: 's_kill_glitch1.ogg'

  - type: narration
    text: |
      那个轮廓在讲台前站了几秒。
      然后像信号不好的电视画面一样，碎成噪点，散了。

  - type: narration
    text: |
      教室里只剩你一个人。
      两本台本摊在讲台上——钦灵的那本，和她的那本。
      两本的最后一页，都被撕掉了。

  - type: horror_log
    text: 'ACT2_COMPLETE // process transferred to containment'
    lines: 10

  - type: narration
    text: |
      ——《第七个测试剧本》 第二周目 完——
      （下周目：只有"她"的房间）

  # 谢幕清理
  - type: background_effect
    effect: 'none'

  - type: voice_shift
    rate: 1.0
    pitch: 0

  - type: music
    musicPath: none

  # 可重放幕末事务；delete 事件会先把 checkpoint 刷入持久状态，再修改外部文件。
  - type: set_variable
    options:
      - actions:
          - type: set_var
            content: 'marker_checkpoint = act2_to_act3'

  - type: character_file
    action: ensure
    file: MAIN.chr

  - type: character_file
    action: delete
    file: ql.chr

  - type: set_variable
    options:
      - actions:
          - type: set_var
            content: 'current_act = 3'
          - type: set_var
            content: 'marker_schema_version = 1'

  # ql 的舞台角色仍被驱逐，但外部标记立即作为隐藏恢复锚点重新落盘；这样 Act 3
  # 删除 MAIN.chr 后仍有一个 .chr，不会与“玩家把所有标记全删”的 GhostScriptLock 撞车。
  - type: character_file
    action: ensure
    file: ql.chr

  - type: main_menu_effect
    theme: ghost
    message: 'ql.chr recovery anchor staged // MAIN.chr remains'

  - type: set_variable
    options:
      - actions:
          - type: set_var
            content: 'marker_checkpoint = none'

  - type: chapter_end
    end_type: linear
    next_chapter: 'end'
